name: Fix Maket 3D and Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  fix-and-build:
    if: ${{ !contains(github.event.head_commit.message, '[maket-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Flutter navigation and maket
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('flutter/lib/main.dart')
          s=p.read_text()
          if "import 'maket_3d.dart';" not in s:
              s=s.replace("import 'rab_engine.dart';", "import 'rab_engine.dart';\nimport 'maket_3d.dart';")
          s=s.replace("      MorePage(onNav: nav),\n", "      MorePage(onNav: nav),\n      const FullMaketView(),\n")
          s=s.replace("_item(context, 4, 'Galeri / Maket', Icons.view_in_ar)", "_item(context, 9, 'Galeri / Maket', Icons.view_in_ar)")
          s=s.replace("('Galeri / Maket', Icons.view_in_ar, 4)", "('Galeri / Maket', Icons.view_in_ar, 9)")
          s=s.replace("MaketView(\n            result: result,\n            topView: topView,\n            onTop: () => setState(() => topView = !topView),\n          )", "FullMaketView(result: result)")
          # Repair an accidental line-break inside the profile subtitle string if present.
          s=s.replace("'${profile['address'] ?? ''}\\\n${profile['contact'] ?? ''}'", "'${profile['address'] ?? ''}\\n${profile['contact'] ?? ''}'")
          p.write_text(s)
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Analyze
        working-directory: flutter
        run: flutter analyze

      - name: Test
        working-directory: flutter
        run: flutter test

      - name: Build release APK
        working-directory: flutter
        run: flutter build apk --release

      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter/lib/main.dart flutter/lib/maket_3d.dart
          git diff --cached --quiet || git commit -m 'fix(flutter): activate house types and interactive 3D maket [maket-fixed]'
          git push

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rab-rumahku-apk-3d-final
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
