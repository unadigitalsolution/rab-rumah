name: Fix Maket 3D and Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  fix-and-build:
    if: ${{ !contains(github.event.head_commit.message, '[maket-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Flutter navigation, maket and license
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('flutter/lib/main.dart')
          s=p.read_text()
          if "import 'maket_3d.dart';" not in s:
              s=s.replace("import 'rab_engine.dart';", "import 'rab_engine.dart';\nimport 'maket_3d.dart';\nimport 'license.dart';")
          elif "import 'license.dart';" not in s:
              s=s.replace("import 'maket_3d.dart';", "import 'maket_3d.dart';\nimport 'license.dart';")
          if "const FullMaketView()," not in s:
              s=s.replace("      MorePage(onNav: nav),\n", "      MorePage(onNav: nav),\n      const FullMaketView(),\n")
          if "const AppLicensePage()," not in s:
              s=s.replace("      const ReceiptPage(),\n", "      const ReceiptPage(),\n      const AppLicensePage(),\n")
          s=s.replace("_item(context, 4, 'Galeri / Maket', Icons.view_in_ar)", "_item(context, 5, 'Galeri / Maket', Icons.view_in_ar)")
          s=s.replace("_item(context, 5, 'Laporan', Icons.assessment)", "_item(context, 6, 'Laporan', Icons.assessment)")
          s=s.replace("_item(context, 6, 'Pengaturan & Lisensi', Icons.settings)", "_item(context, 7, 'Pengaturan', Icons.settings)")
          s=s.replace("_item(context, 7, 'Kalkulator', Icons.calculate)", "_item(context, 8, 'Kalkulator', Icons.calculate)")
          s=s.replace("_item(context, 8, 'Kwitansi', Icons.receipt_long)", "_item(context, 9, 'Kwitansi', Icons.receipt_long)")
          if "_item(context, 10, 'Lisensi'" not in s:
              s=s.replace("          _item(context, 9, 'Kwitansi', Icons.receipt_long),", "          _item(context, 9, 'Kwitansi', Icons.receipt_long),\n          _item(context, 10, 'Lisensi', Icons.key),")
          s=s.replace("('Galeri / Maket', Icons.view_in_ar, 4)", "('Galeri / Maket', Icons.view_in_ar, 5)")
          s=s.replace("('Laporan', Icons.assessment, 5)", "('Laporan', Icons.assessment, 6)")
          s=s.replace("('Pengaturan & Lisensi', Icons.settings, 6)", "('Pengaturan', Icons.settings, 7)")
          s=s.replace("('Kalkulator', Icons.calculate, 7)", "('Kalkulator', Icons.calculate, 8)")
          s=s.replace("('Kwitansi', Icons.receipt_long, 8)", "('Kwitansi', Icons.receipt_long, 9)")
          if "('Lisensi', Icons.key, 10)" not in s:
              s=s.replace("('Kwitansi', Icons.receipt_long, 9),", "('Kwitansi', Icons.receipt_long, 9),\n      ('Lisensi', Icons.key, 10),")
          s=s.replace("MaketView(\n            result: result,\n            topView: topView,\n            onTop: () => setState(() => topView = !topView),\n          )", "FullMaketView(result: result)")
          s=s.replace("        body: pages[page],", "        body: (page == 7 || page == 10)\n            ? pages[page]\n            : LicenseGate(onOpenLicense: () => nav(10), child: pages[page]),")
          p.write_text(s)
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Format and verify source
        working-directory: flutter
        run: |
          dart format lib/main.dart lib/maket_3d.dart lib/license.dart

      - name: Dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Analyze
        working-directory: flutter
        run: flutter analyze

      - name: Test
        working-directory: flutter
        run: flutter test

      - name: Build release APK
        working-directory: flutter
        run: flutter build apk --release

      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter/lib/main.dart flutter/lib/maket_3d.dart flutter/lib/license.dart
          git diff --cached --quiet || git commit -m 'fix(flutter): final maket 3D and license gate [maket-fixed]'
          git push

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rab-rumahku-apk-final
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
