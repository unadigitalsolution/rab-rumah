name: Build RAB Rumahku APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: flutter
        run: flutter create . --platforms=android --org com.unadigitalsolution --project-name rab_rumahku

      - name: Sinkronisasi Kotlin Gradle plugin
        working-directory: flutter
        run: |
          sed -i 's/1.7.10/1.9.24/g' android/settings.gradle android/build.gradle 2>/dev/null || true
          grep -R "kotlin" android/settings.gradle android/build.gradle || true

      - name: Ambil dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Validasi analyze
        working-directory: flutter
        run: flutter analyze --no-fatal-infos

      - name: Jalankan test
        working-directory: flutter
        run: flutter test

      - name: Build APK Release
        working-directory: flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rab-rumahku-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
