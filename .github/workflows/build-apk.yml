name: Build RAB Rumahku APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Verifikasi Android platform
        working-directory: flutter
        run: |
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/settings.gradle
          test -f android/app/build.gradle

      - name: Set Kotlin Gradle Plugin yang kompatibel
        working-directory: flutter
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*" apply false/id "org.jetbrains.kotlin.android" version "1.9.24" apply false/' android/settings.gradle
          sed -i "s/id 'org.jetbrains.kotlin.android' version '[^']*' apply false/id 'org.jetbrains.kotlin.android' version '1.9.24' apply false/" android/settings.gradle
          sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/" android/build.gradle

      - name: Ambil dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Validasi analyze
        working-directory: flutter
        run: flutter analyze

      - name: Jalankan test
        working-directory: flutter
        run: flutter test

      - name: Build APK Release
        working-directory: flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rab-rumahku-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
